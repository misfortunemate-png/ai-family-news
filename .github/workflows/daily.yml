name: daily

on:
  schedule:
    - cron: '0 21 * * *'   # UTC 21:00 = JST 06:00
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: false
        description: 'dry-run（採点スキップ）'

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Collect
        run: node scripts/collect.mjs

      - name: Select
        run: node scripts/select.mjs
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '0' }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ logs/
          COUNT_ITEMS=$(cat data/items/$(date +%Y-%m-%d).jsonl 2>/dev/null | wc -l || echo 0)
          COUNT_CAND=$(python3 -c "import yaml,sys; d=yaml.safe_load(open('data/candidates/$(date +%Y-%m-%d).yaml')); print(d.get('count',0))" 2>/dev/null || echo 0)
          git diff --cached --quiet || git commit -m "[daily] $(date +%Y-%m-%d) 収集${COUNT_ITEMS}件 短冊${COUNT_CAND}件"
          git pull --rebase origin main
          git push origin main
