    serif: 雪かきしながらじわじわ怖くなる、それが堪らない
    comment: 'Chilla''s Artといえば「夜勤事件」など、日常の中に恐怖が滲み出る独特の空気感が魅力。今作は雪山でひたすらシャベルで雪を掘り進めるという、一見地味な作業がメイン。でもその単調さこそが罠で、黙々と掘り続けるうちに少しずつ異変に気づいていく構造は絶対に怖い。遠くの電波塔を目指すという孤独な目標設定も不安感を煽っていて、ホラーとして完璧な舞台だと思う。'
