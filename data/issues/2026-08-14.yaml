    serif: シャベルで雪を掘るだけなのに、なぜこんなに怖いんだ
    comment: 'Chilla''s Artといえば「夜勤事件」など、日常的な状況をホラーに変える名手。今作は雪山でひたすらシャベルで雪を掘り進むというシンプルすぎる設定なのに、一人称視点で迫ってくる恐怖感はさすが。「雪葬」というタイトルが示す通り、雪の中に何かが埋まっている予感がずっとつきまとう。単純作業の反復がじわじわ不安を積み上げる構造、これがたまらない。'
    body_read: false
    selection_reason: 'Chilla''s Artの新作というだけで反応してしまう。雪山でシャベルで掘り進めるっていうシンプルな設定なのに、一人称ホラーにするのがすごく好きな感覚。「雪葬」ってタイトルも不穏でいい。'
